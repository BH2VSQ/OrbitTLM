name: CMake Qt6 CI
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libdbus-1-3 libfontconfig1 libwayland-dev fonts-noto-cjk xvfb xauth
      - name: Install pinned Qt6 Linux runtime and SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          modules: qtcharts qtwaylandcompositor
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload Qt overview screenshot (if available)
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-UI-preview
          path: build/*preview.png
          if-no-files-found: ignore
      - name: Package Linux AppImage
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" bash tools/package_appimage.sh build dist
      - name: Test AppImage on clean Ubuntu 22.04, Ubuntu 24.04 and Debian 13 without Qt
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:13; do
            distro=${image//:/-}
            mkdir -p "runtime-results/$distro"
            chmod 777 "runtime-results/$distro"
            docker run --rm -v "$PWD:/src:ro" -v "$PWD/runtime-results/$distro:/results" "$image" bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends python3 xvfb xauth weston libgl1 libegl1 libfontconfig1 fonts-dejavu-core
              if dpkg-query -W -f="\${binary:Package}\n" "libqt6*" 2>/dev/null | grep -q "^libqt6"; then
                echo "Clean runtime unexpectedly contains system Qt" >&2
                exit 1
              fi
              cp /etc/os-release /results/os-release
              mkdir /tmp/orbittlm-readonly
              cd /tmp/orbittlm-readonly
              /src/dist/OrbitTLM-Linux-x86_64.AppImage --appimage-extract >/dev/null
              chmod -R a-w squashfs-root
              runuser -u nobody -- python3 /src/tools/smoke_appimage.py /src/dist/OrbitTLM-Linux-x86_64.AppImage /results --readonly-appdir /tmp/orbittlm-readonly/squashfs-root
              runuser -u nobody -- python3 /src/tools/smoke_wayland.py /src/dist/OrbitTLM-Linux-x86_64.AppImage /results/wayland
            '
          done
      - name: Upload Linux startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-Linux-startup-diagnostics
          path: runtime-results/**
          if-no-files-found: ignore
      - name: Archive Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-linux
          path: |
            dist/OrbitTLM-Linux-x86_64.AppImage
            dist/OrbitTLM-Linux-x86_64.AppImage.sha256

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 desktop
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Configure MSVC 2022
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package distributable Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD "build\Release"
          $stage = Join-Path $PWD "dist\OrbitTLM"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # CTest executables remain in build/Release for CI only.
          # Copy an explicit allowlist instead of publishing the entire build directory.
          Copy-Item (Join-Path $release "OrbitTLM.exe") $stage
          Copy-Item (Join-Path $release "OrbitTLM-cli.exe") $stage
          $catalog = Join-Path $release "protocols\asrtu1"
          if (-not (Test-Path $catalog)) { throw "Missing packaged ASRTU-1 field catalog: $catalog" }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "protocols") | Out-Null
          Copy-Item $catalog (Join-Path $stage "protocols\asrtu1") -Recurse
          Copy-Item (Join-Path $release "telemetry-trees") (Join-Path $stage "telemetry-trees") -Recurse
          Copy-Item (Join-Path $release "web") (Join-Path $stage "web") -Recurse
          Copy-Item "README.md" $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "licenses\ssdv_dslwp") | Out-Null
          Copy-Item "build\_deps\orbittlm_vendor\third_party\ssdv_dslwp\COPYING" (Join-Path $stage "licenses\ssdv_dslwp")

          $deploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          if (-not (Test-Path $deploy)) { throw "windeployqt.exe missing in Qt installation" }
          & $deploy --release --no-translations --dir $stage (Join-Path $stage "OrbitTLM.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for GUI" }
          & $deploy --release --no-translations --dir $stage (Join-Path $stage "OrbitTLM-cli.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for CLI" }

          # Runtime dependency and telemetry-catalog checks.
          $required = @(
            "OrbitTLM.exe", "OrbitTLM-cli.exe",
            "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll",
            "Qt6Charts.dll", "Qt6Network.dll", "Qt6Sql.dll",
            "platforms\qwindows.dll", "sqldrivers\qsqlite.dll",
            "protocols\asrtu1\SAT-S3.json", "telemetry-trees\BY04.json", "web\index.template.html"
          )
          foreach ($relative in $required) {
            $target = Join-Path $stage $relative
            if (-not (Test-Path $target)) { throw "Windows package is missing required file: $relative" }
          }
          $forbidden = @("orbit_ui_tests.exe", "orbit_tests.exe", "Qt6Test.dll")
          foreach ($name in $forbidden) {
            if (Test-Path (Join-Path $stage $name)) { throw "Developer test binary leaked into Windows package: $name" }
          }
          # CLI dependency check against the staged files, not the Qt development environment.
          $savedPath = $env:PATH
          try {
            $env:PATH = "$stage;$env:SystemRoot\System32;$env:SystemRoot"
            & (Join-Path $stage "OrbitTLM-cli.exe") --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Packaged CLI startup smoke test failed" }
          } finally { $env:PATH = $savedPath }

          @'
          OrbitTLM - 卫星遥测回放工作台

          请运行 OrbitTLM.exe（正式桌面程序）。
          如需离线批量导出，请运行 OrbitTLM-cli.exe。
          orbit_ui_tests.exe / orbit_tests.exe 属于 CI 测试工具，不在此用户安装包中。
          请完整解压后运行，勿单独移动 exe 或删除 Qt DLL、plugins、protocols 目录。
          '@ | Set-Content -Path (Join-Path $stage "使用说明.txt") -Encoding utf8

          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath "OrbitTLM-Windows-x64.zip" -Force
          $digest = (Get-FileHash "OrbitTLM-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  OrbitTLM-Windows-x64.zip" | Set-Content "OrbitTLM-Windows-x64.zip.sha256" -Encoding ascii

      - name: Verify Windows ZIP excludes developer test programs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $PWD "OrbitTLM-Windows-x64.zip"
          $check = Join-Path $PWD "dist\verify"
          Expand-Archive -Path $zip -DestinationPath $check -Force
          foreach ($name in @("OrbitTLM.exe", "OrbitTLM-cli.exe",
                "Qt6Core.dll", "platforms\qwindows.dll", "sqldrivers\qsqlite.dll",
                "protocols\asrtu1\SAT-S3.json")) {
            if (-not (Test-Path (Join-Path $check $name))) { throw "ZIP verification failed: $name" }
          }
          foreach ($name in @("orbit_ui_tests.exe", "orbit_tests.exe", "Qt6Test.dll")) {
            if (Test-Path (Join-Path $check $name)) { throw "Unexpected CI test artifact: $name" }
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-windows-x64
          path: |
            OrbitTLM-Windows-x64.zip
            OrbitTLM-Windows-x64.zip.sha256
      - name: Upload Windows Japanese UI preview
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-UI-preview-windows
          path: build/Release/*preview.png
          if-no-files-found: error
