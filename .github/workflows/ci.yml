name: CMake Qt6 CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 and SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ qt6-base-dev qt6-charts-dev libqt6sql6-sqlite
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Archive Linux program
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-linux
          path: |
            build/OrbitTLM
            build/OrbitTLM-cli
            build/protocols/asrtu1/**

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 desktop
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Configure MSVC 2022
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations "build\Release\OrbitTLM.exe"
          Compress-Archive -Path "build\Release\*" -DestinationPath "OrbitTLM-Windows-x64.zip"
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTLM-windows-x64
          path: OrbitTLM-Windows-x64.zip
