<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OrbitTLM 遥测历史</title><style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#182940;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:1500px;margin:auto}header,.panel{background:#fff;border:1px solid #dfe7f0;border-radius:10px;padding:14px;margin-bottom:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0 0 5px}h2{font-size:15px;margin:0 0 10px}.muted{color:#71839a;font-size:12px}.filters{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filters label{font-size:12px;color:#586c83;display:flex;flex-direction:column;gap:4px}input,select,button{font:inherit;padding:7px 9px;border:1px solid #d3deeb;border-radius:6px;background:#fff}button{cursor:pointer;background:#edf5ff} .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stat{background:#f7faff;border:1px solid #e3ebf5;padding:9px;border-radius:7px}.stat strong{display:block;font-size:19px;margin-top:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:12px}.scroll{max-height:410px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #e8eef5;white-space:nowrap}th{position:sticky;top:0;background:#f5f8fc}canvas{width:100%;height:280px;display:block} @media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:8px}}
</style></head><body><header><div><h1>OrbitTLM · 遥测历史</h1><div class="muted">本地解码记录 · 数据由 OrbitTLM 自动更新 · 时间采用接收端记录时间</div></div><button onclick="downloadCsv()">导出当前筛选 CSV</button></header>
<section class="panel filters"><label>卫星<select id="sat"><option value="all">全部卫星</option></select></label><label>参数<select id="field"><option value="all">全部参数</option></select></label><label>开始时间<input type="datetime-local" id="from"></label><label>结束时间<input type="datetime-local" id="to"></label><label>关键词<input id="q" placeholder="参数名 / 业务包"></label><button onclick="render()">应用筛选</button><button onclick="resetFilters()">重置</button></section>
<section class="panel"><div class="stats"><div class="stat">记录数<strong id="n">0</strong></div><div class="stat">参数数<strong id="nf">0</strong></div><div class="stat">最小值<strong id="min">—</strong></div><div class="stat">最大值 / 平均值<strong id="maxavg">—</strong></div></div></section>
<div class="layout"><main><section class="panel"><h2>参数时间序列</h2><div class="muted" id="chartNote">选择具体参数查看曲线</div><canvas id="chart" width="1000" height="300"></canvas></section><section class="panel"><h2>遥测记录</h2><div class="scroll"><table><thead><tr><th>时间</th><th>卫星</th><th>业务包</th><th>参数</th><th>值</th><th>单位</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><aside><section class="panel"><h2>参数统计</h2><div class="scroll"><table><thead><tr><th>参数</th><th>样本</th><th>最小</th><th>最大</th><th>平均</th></tr></thead><tbody id="statsRows"></tbody></table></div></section><section class="panel"><h2>数据说明</h2><div class="muted">仅将协议字段表成功解码的工程量参与数值统计。原始值、无效值和未定义字段保留在原始数据文件中，但不会被当作有效工程量绘图。接收时间不代表已确认的星载 UTC。</div><p><a href="telemetry.json">查看 JSON 数据</a></p><p><a href="telemetry.csv">下载全部 CSV</a></p></section></aside></div>
<script>const DATA=__DATA_JSON__;const packets=DATA;const all=[];for(const p of packets){for(const f of (p.fields||[])){all.push({time:p.capture_local||'',sat:p.satellite||'未知',packet:p.packet||p.packet_label||'未分类',name:f.name_cn||f.code||'未命名',code:f.code||'',value:f.value??'',unit:f.unit||'',status:f.status||'',raw:f.raw_number||''})}}const $=id=>document.getElementById(id);const num=x=>{if(x===null||x===undefined||String(x).trim()==='')return NaN;const n=Number(String(x).replace(/,/g,''));return Number.isFinite(n)?n:NaN};function init(){[...new Set(all.map(x=>x.sat))].sort().forEach(v=>$('sat').add(new Option(v,v)));fillFields();render()}function fillFields(){const old=$('field').value;const arr=[...new Set(all.filter(x=>$('sat').value==='all'||x.sat===$('sat').value).map(x=>x.name+'|||'+x.code))].sort();$('field').innerHTML='<option value="all">全部参数</option>';arr.forEach(s=>{const [n,c]=s.split('|||');$('field').add(new Option(n,c||n))});if([...$('field').options].some(o=>o.value===old))$('field').value=old}function filtered(){const sat=$('sat').value,field=$('field').value,q=$('q').value.toLowerCase(),from=$('from').value,to=$('to').value;return all.filter(x=>(sat==='all'||x.sat===sat)&&(field==='all'||x.code===field||x.name===field)&&(!q||(x.name+' '+x.packet+' '+x.code).toLowerCase().includes(q))&&(!from||x.time>=from)&&(!to||x.time<=to+':59.999'))}function render(){fillFields();const d=filtered();$('n').textContent=d.length;$('nf').textContent=new Set(d.map(x=>x.code||x.name)).size;const vals=d.map(x=>num(x.value)).filter(Number.isFinite);$('min').textContent=vals.length?Math.min(...vals).toPrecision(6):'—';$('maxavg').textContent=vals.length?Math.max(...vals).toPrecision(6)+' / '+(vals.reduce((a,b)=>a+b,0)/vals.length).toPrecision(6):'—';$('rows').innerHTML=d.slice(-1000).reverse().map(x=>`<tr><td>${esc(x.time)}</td><td>${esc(x.sat)}</td><td>${esc(x.packet)}</td><td title="${esc(x.code)}">${esc(x.name)}</td><td>${esc(x.value)}</td><td>${esc(x.unit)}</td><td>${esc(x.status)}</td></tr>`).join('');const groups={};for(const x of d){const n=num(x.value);if(!Number.isFinite(n))continue;const k=x.code||x.name;(groups[k]??={name:x.name,values:[]}).values.push(n)}$('statsRows').innerHTML=Object.values(groups).map(g=>`<tr><td>${esc(g.name)}</td><td>${g.values.length}</td><td>${Math.min(...g.values).toPrecision(5)}</td><td>${Math.max(...g.values).toPrecision(5)}</td><td>${(g.values.reduce((a,b)=>a+b,0)/g.values.length).toPrecision(5)}</td></tr>`).join('');drawChart(d)}function drawChart(d){const c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);const series=d.filter(x=>Number.isFinite(num(x.value))).slice(-500);if($('field').value==='all'||series.length<2){ctx.fillStyle='#71839a';ctx.font='16px sans-serif';ctx.fillText('请选择一个参数，并确保筛选范围内至少有两个数值样本',20,35);$('chartNote').textContent='当前 '+series.length+' 个数值样本';return}const ys=series.map(x=>num(x.value)),lo=Math.min(...ys),hi=Math.max(...ys),span=hi-lo||1;ctx.strokeStyle='#dfe7f0';ctx.fillStyle='#71839a';ctx.font='12px sans-serif';for(let i=0;i<5;i++){const y=20+i*(h-50)/4;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-15,y);ctx.stroke();ctx.fillText((hi-i*span/4).toPrecision(5),2,y+4)}ctx.strokeStyle='#2675c9';ctx.lineWidth=2;ctx.beginPath();series.forEach((x,i)=>{const px=45+i*(w-65)/(series.length-1),py=20+(hi-num(x.value))*(h-50)/span;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();$('chartNote').textContent=series[0].name+' · '+series.length+' 个样本 · '+series[0].unit}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function downloadCsv(){const d=filtered(),cols=['time','sat','packet','name','code','value','unit','status'];const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[cols.join(','),...d.map(x=>cols.map(k=>q(x[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='telemetry-filtered.csv';a.click();URL.revokeObjectURL(a.href)}function resetFilters(){$('sat').value='all';$('field').value='all';$('from').value='';$('to').value='';$('q').value='';render()}$('sat').addEventListener('change',()=>{fillFields();render()});$('field').addEventListener('change',render);init();</script></body></html>
